}

type DisputeList {
  disputes: [Dispute!]!
}

type DisputeMessageList {
  messages: [DisputeMessage!]!
}

# ── Admin Types ───────────────────────────────────────────────────────────────

type PlatformMetrics {
  totalUsers: Int!
  totalSellers: Int!
  activeDisputes: Int!
  totalOrders: Int!
}

