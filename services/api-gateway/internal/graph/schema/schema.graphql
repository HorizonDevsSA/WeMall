}

type SellerOrderList {
  orders: [Order!]!
  nextPageToken: String
  total: Int!
}

# ── Dispute Types ─────────────────────────────────────────────────────────────

enum DisputeStatus {
  OPEN
  SELLER_REVIEW
  ESCALATED
  RESOLVED_REFUNDED
  RESOLVED_REJECTED
}

type Dispute {
  id: ID!
  orderId: ID!
