syntax = "proto3";
package seller.v1;
option go_package = "github.com/wemall/gen/seller/v1;sellerv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum SellerStatus {
  SELLER_STATUS_UNSPECIFIED = 0;
  SELLER_STATUS_PENDING     = 1;
  SELLER_STATUS_PROCESSING  = 2;
  SELLER_STATUS_VERIFIED    = 3;
  SELLER_STATUS_SUSPENDED   = 4;
}

enum PayoutStatus {
  PAYOUT_STATUS_UNSPECIFIED = 0;
  PAYOUT_STATUS_PENDING     = 1;
  PAYOUT_STATUS_PROCESSING  = 2;
  PAYOUT_STATUS_PAID        = 3;
  PAYOUT_STATUS_FAILED      = 4;
}

// ── Core Types ────────────────────────────────────────────────────────────────

message Seller {
  string                    id                             = 1;
  string                    user_id                        = 2;
  string                    store_name                     = 3;
  string                    store_slug                     = 4;
  string                    logo_url                       = 5;
  string                    banner_url                     = 6;
  string                    description                    = 7;
  double                    rating                         = 8;
  int32                     total_sales                    = 9;
  bool                      is_verified                    = 10;
  double                    latitude                       = 11;
  double                    longitude                      = 12;
  google.protobuf.Timestamp created_at                     = 13;
  google.protobuf.Timestamp updated_at                     = 14;
  SellerStatus              status                         = 15;
  string                    store_location                 = 16;
  string                    shipping_zones                 = 17;
  string                    bank_name                      = 18;
  string                    bank_account_number            = 19;
  string                    ecocash_number                 = 20;
  int32                     return_window_days             = 21;
  string                    return_policy_text             = 22;
  bool                      push_notifications_enabled      = 23;
  bool                      email_alerts_enabled           = 24;
  bool                      sms_alerts_enabled             = 25;
  bool                      auto_accept_orders             = 26;
  bool                      inventory_alerts_enabled       = 27;
  bool                      profile_visibility             = 28;
  bool                      search_indexing_enabled        = 29;
  bool                      data_sharing_enabled           = 30;
  bool                      two_factor_enabled             = 31;
  string                    deactivation_reason            = 32;
  bool                      has_pin                        = 33;
  string                    chat_group_id                  = 34;
}

message Payout {
  string                    id            = 1;
  string                    seller_id     = 2;
  double                    amount        = 3;
  string                    currency      = 4;
  PayoutStatus              status        = 5;
  string                    provider_ref  = 6;
  google.protobuf.Timestamp paid_at       = 7;
  google.protobuf.Timestamp created_at    = 8;
  double                    gross_amount  = 9;
  double                    platform_fee  = 10;
  double                    net_amount    = 11;
}

// ── Seller Requests ───────────────────────────────────────────────────────────

message GetSellerRequest {
  string id = 1;
}

message GetSellerByUserIDRequest {
  string user_id = 1;
}

message GetSellerBatchRequest {
  repeated string ids = 1;
}

message GetSellerBatchResponse {
  map<string, Seller> sellers = 1;
}

message CreateStoreRequest {
  string user_id        = 1;
  string store_name     = 2;
  string description    = 3;
  string logo_url       = 4;
  string banner_url     = 5;
  double latitude       = 6;
  double longitude      = 7;
  string store_location = 8;
}

message UpdateStoreRequest {
  string          user_id                    = 1;
  string          store_name                 = 2;
  string          description                = 3;
  string          logo_url                   = 4;
  string          banner_url                 = 5;
  double          latitude                   = 6;
  double          longitude                  = 7;
  string          store_location             = 8;
  optional string shipping_zones             = 9;
  optional string bank_name                  = 10;
  optional string bank_account_number        = 11;
  optional string ecocash_number             = 12;
  optional int32  return_window_days         = 13;
  optional string return_policy_text         = 14;
  optional bool   push_notifications_enabled  = 15;
  optional bool   email_alerts_enabled       = 16;
  optional bool   sms_alerts_enabled         = 17;
  optional bool   auto_accept_orders         = 18;
  optional bool   inventory_alerts_enabled   = 19;
  optional bool   profile_visibility         = 20;
  optional bool   search_indexing_enabled    = 21;
  optional bool   data_sharing_enabled       = 22;
  optional bool   two_factor_enabled         = 23;
  optional string deactivation_reason        = 24;
  optional string pin                        = 25;
  optional string chat_group_id              = 26;
}

message VerifySellerRequest {
  string seller_id = 1;
  bool   verified  = 2;
}

message UpdateSellerStatusRequest {
  string seller_id = 1;
  SellerStatus status = 2;
}

// ── Follow Requests ───────────────────────────────────────────────────────────

message FollowStoreRequest {
  string user_id   = 1;
  string seller_id = 2;
}

message UnfollowStoreRequest {
  string user_id   = 1;
  string seller_id = 2;
}

message IsFollowingStoreRequest {
  string user_id   = 1;
  string seller_id = 2;
}

message IsFollowingStoreResponse {
  bool is_following = 1;
}

message ListFollowedStoresRequest {
  string user_id    = 1;
  int32  page_size  = 2;
  string page_token = 3;
}

message ListFollowedStoresResponse {
  repeated Seller sellers         = 1;
  string          next_page_token = 2;
  int32           total           = 3;
}

message ListStoreFollowersRequest {
  string seller_id = 1;
}

message ListStoreFollowersResponse {
  repeated string user_ids = 1;
}

// ── Payout Requests ───────────────────────────────────────────────────────────

message ListPayoutsRequest {
  string seller_id  = 1;
  int32  page_size  = 2;
  string page_token = 3;
}

message ListPayoutsResponse {
  repeated Payout payouts         = 1;
  string          next_page_token = 2;
  int32           total           = 3;
}

message GetPayoutRequest {
  string id        = 1;
  string seller_id = 2;
}

message CreatePayoutRequest {
  string seller_id = 1;
  double amount    = 2;
  string currency  = 3;
}

// ── Service ───────────────────────────────────────────────────────────────────

service SellerService {
  rpc GetSeller(GetSellerRequest) returns (Seller);
  rpc GetSellerByUserID(GetSellerByUserIDRequest) returns (Seller);
  rpc GetSellerBatch(GetSellerBatchRequest) returns (GetSellerBatchResponse);

  rpc CreateStore(CreateStoreRequest) returns (Seller);
  rpc UpdateStore(UpdateStoreRequest) returns (Seller);
  rpc VerifySeller(VerifySellerRequest) returns (Seller);
  rpc UpdateSellerStatus(UpdateSellerStatusRequest) returns (Seller);

  // Store follows
  rpc FollowStore(FollowStoreRequest) returns (google.protobuf.Empty);
  rpc UnfollowStore(UnfollowStoreRequest) returns (google.protobuf.Empty);
  rpc IsFollowingStore(IsFollowingStoreRequest) returns (IsFollowingStoreResponse);
  rpc ListFollowedStores(ListFollowedStoresRequest) returns (ListFollowedStoresResponse);
  rpc ListStoreFollowers(ListStoreFollowersRequest) returns (ListStoreFollowersResponse);

  rpc ListPayouts(ListPayoutsRequest) returns (ListPayoutsResponse);
  rpc GetPayout(GetPayoutRequest) returns (Payout);
  rpc CreatePayout(CreatePayoutRequest) returns (Payout);

  // Monetization & Ledger APIs
  rpc GetSellerBalance(GetSellerBalanceRequest) returns (SellerBalanceResponse);
  rpc GetSellerEarningsLedger(GetSellerEarningsLedgerRequest) returns (SellerEarningsLedgerResponse);
  rpc AddAdCredit(AddAdCreditRequest) returns (AddAdCreditResponse);
  rpc GetSellerMonetizationConfig(GetSellerMonetizationConfigRequest) returns (SellerMonetizationConfig);

  // Security & PIN APIs
  rpc SetSellerPIN(SetSellerPINRequest) returns (google.protobuf.Empty);
  rpc RevealBankDetails(RevealBankDetailsRequest) returns (RevealBankDetailsResponse);
}

// ── Monetization & Ledger Requests/Responses ───────────────────────────────────

message GetSellerBalanceRequest {
  string seller_id = 1;
}

message SellerBalanceResponse {
  double escrowed_balance     = 1;
  double withdrawable_balance = 2;
  double total_sales          = 3;
}

message GetSellerEarningsLedgerRequest {
  string seller_id     = 1;
  int32  page_size     = 2;
  string page_token    = 3;
  string status_filter = 4; // escrowed, earned, refunded, payout_released
}

message EarningsLedgerEntry {
  string                    id             = 1;
  string                    order_id       = 2;
  string                    order_item_id  = 3;
  double                    gross_amount   = 4;
  double                    commission_fee = 5;
  double                    net_amount     = 6;
  string                    status         = 7;
  google.protobuf.Timestamp created_at     = 8;
  google.protobuf.Timestamp settled_at     = 9;
}

message SellerEarningsLedgerResponse {
  repeated EarningsLedgerEntry entries         = 1;
  string                  next_page_token = 2;
}

message AddAdCreditRequest {
  string seller_id                = 1;
  double amount                   = 2;
  bool   fund_from_payout_balance = 3; // If true, transfers from pending payout balance
}

message AddAdCreditResponse {
  double new_ad_credit_balance = 1;
}

message GetSellerMonetizationConfigRequest {
  string seller_id = 1;
}

message SellerMonetizationConfig {
  double commission_rate    = 1;
  double ad_credit_balance = 2;
}

// ── Security & PIN Requests/Responses ─────────────────────────────────────────

message SetSellerPINRequest {
  string user_id = 1;
  string pin     = 2;
}

message RevealBankDetailsRequest {
  string user_id = 1;
  string pin     = 2;
}

message RevealBankDetailsResponse {
  string bank_name           = 1;
  string bank_account_number = 2;
  string ecocash_number      = 3;
}

